# ─────────────────────────────────────────────────────────────────────────────
#  Render Blueprint — Beauty & Aesthetic Clinic
#
#  One free Docker web service serving the NestJS API and the compiled web app
#  on a single origin:  https://beauty-clinic.onrender.com
#
#  The database is an EXTERNAL managed Postgres (Neon free tier) because Render's
#  free Postgres instances expire 30 days after creation. Fill the DATABASE_*
#  values from your Neon connection string when Render prompts for them.
#
#  Free instances spin down after 15 minutes idle; the next request wakes them
#  up in roughly a minute.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: beauty-clinic
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SYNCHRONIZE
        value: 'false'
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Public URL of this service (single origin → same for API and web app).
      - key: PUBLIC_ORIGIN
        value: https://beauty-clinic.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://beauty-clinic.onrender.com
      - key: BASE_DOMAIN
        value: beauty-clinic.onrender.com

      # ── Neon (managed Postgres) — Render prompts for these on first deploy ──
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
